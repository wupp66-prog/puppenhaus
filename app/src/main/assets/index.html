<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ben &amp; Mia – Puppenhaus</title>
<style>
:root{--ink:#2E2A4F}
html,body{margin:0;height:100%;background:#2E2A4F;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:'Fredoka','Baloo 2','Nunito','Trebuchet MS',system-ui,sans-serif;color:var(--ink)}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;background:#FFF8EC}
.room{position:absolute;left:0;top:0;width:1600px;height:790px;display:none}
.room.on{display:block}
.room svg.back{position:absolute;left:0;top:0}
#ents{position:absolute;left:0;top:0;width:1600px;height:790px;pointer-events:none}
.front{position:absolute;left:0;top:0;pointer-events:none}
.ent{position:absolute;pointer-events:auto;touch-action:none;cursor:grab}
.ent svg{display:block;overflow:visible}
.ent .inner{transform-origin:50% 100%}
.ent.fall{transition:top .28s cubic-bezier(.5,0,.9,.6),left .28s ease-out}
.ent.drag{cursor:grabbing}
.ent.drag .inner{animation:held .5s ease-in-out infinite}
.ent .inner.jump{animation:jump .5s ease-out}
.ent .inner.wiggle{animation:wiggle .5s ease-in-out}
.ent .inner.bounce{animation:bounce .7s ease-out}
.ent .inner.pop{animation:popin .35s ease-out}
.ent.float .inner{animation:bob 1.6s ease-in-out infinite}
.ent.swing{animation:swingK 2.4s ease-in-out infinite}
.ent.rock{animation:rockK 1.4s ease-in-out infinite}
.occ-swing .swingset{animation:swingK 2.4s ease-in-out infinite;transform-box:view-box;transform-origin:350px 200px}
.occ-horse .horse{animation:rockK 1.4s ease-in-out infinite;transform-box:view-box;transform-origin:820px 745px}
@keyframes swingK{0%,100%{transform:rotate(16deg)}50%{transform:rotate(-16deg)}}
@keyframes rockK{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.ent.dance > .inner > svg{animation:dance .46s ease-in-out infinite;transform-origin:50% 100%}
@keyframes dance{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-14px) rotate(5deg)}}
.ent.drive{transition:left .9s ease-in-out}
.ent.slide{transition:left 1s cubic-bezier(.5,0,.6,1),top 1s cubic-bezier(.5,0,.6,1)}
.ent .inner.spin{animation:spinTop 1.4s ease-out}
@keyframes spinTop{0%,20%,40%,70%{transform:scaleX(1)}10%,30%,55%{transform:scaleX(-1)}85%{transform:rotate(12deg)}100%{transform:rotate(0)}}
.bonk{animation:bonk .3s ease-out;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bonk{0%,100%{transform:scale(1)}40%{transform:scale(1.06,.9)}}
.sc1,.sc2,.sc3,.fl1,.fl2,.fl3,.pt0,.pt1,.pt2,.pt3,.bird,.toastup{display:none}
.sand-1 .sc1,.sand-2 .sc1,.sand-2 .sc2,.sand-3 .sc1,.sand-3 .sc2,.sand-3 .sc3{display:inline}
.flow-1 .fl1,.flow-2 .fl1,.flow-2 .fl2,.flow-3 .fl1,.flow-3 .fl2,.flow-3 .fl3{display:inline}
.paint-0 .pt0,.paint-1 .pt1,.paint-2 .pt2,.paint-3 .pt3{display:inline}
.cuckoo .bird,.toast-up .toastup{display:inline}.cuckoo .cdoor{display:none}
.mobile-on .mobile{animation:mob 3s ease-in-out infinite;transform-box:view-box;transform-origin:1250px 40px}
@keyframes mob{0%,100%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
.radiolight{fill:#9AA6B5}.music-on .radiolight{fill:#3BA55C}
.cloud{animation:drift 32s linear infinite}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(1800px)}}
.bfly{animation:fly 9s ease-in-out infinite}
@keyframes fly{0%,100%{transform:translate(0,0)}25%{transform:translate(160px,-60px)}50%{transform:translate(320px,10px)}75%{transform:translate(140px,70px)}}
.bfly .wing{animation:flap .22s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.3)}}
.ffly{display:none}#stage.night .ffly{display:inline}#stage.night .bfly{display:none}
.particle.fallp{animation-name:fallp}
@keyframes fallp{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(110px) scale(1);opacity:0}}
@keyframes held{0%,100%{transform:rotate(-4deg) scale(1.06)}50%{transform:rotate(4deg) scale(1.06)}}
@keyframes jump{0%,100%{transform:translateY(0)}35%{transform:translateY(-60px) scale(1.03,.97)}70%{transform:translateY(0) scale(1.05,.95)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes bounce{0%{transform:translateY(0)}30%{transform:translateY(-120px)}55%{transform:translateY(0) scale(1.15,.85)}75%{transform:translateY(-40px)}100%{transform:translateY(0)}}
@keyframes popin{0%{transform:scale(.2)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}

/* Raum-Zustände */
.glow,.sky-night,.fr-open,.bx-open,.steam,.burner-on,.sinkwater,.tubwater,.swirl,.pf1,.pf2,.pf3,.tvp{display:none}
.lamp-on .glow{display:inline}
#stage.night .sky-night{display:inline}
#stage.night .sky-day{display:none}
.fridge-open .fr-open{display:inline}.fridge-open .fr-closed{display:none}
.box-open .bx-open{display:inline}.box-open .bx-closed{display:none}
.pot-on .steam,.pot-on .burner-on{display:inline}
.sink-on .sinkwater{display:inline}
.tub-pour .tubwater{display:inline}
.flush .swirl{display:inline}
.plant-1 .pf1,.plant-2 .pf1,.plant-2 .pf2,.plant-3 .pf1,.plant-3 .pf2,.plant-3 .pf3{display:inline}
.tv-1 .tvp1,.tv-2 .tvp2,.tv-3 .tvp3{display:inline}
.tv-0 .tvoff{display:inline}
.tvoff{display:none}
.hot{cursor:pointer}
.hint{animation:hint 1.1s ease-in-out;transform-box:fill-box;transform-origin:50% 50%}
@keyframes hint{0%,100%{transform:scale(1)}30%{transform:scale(1.06)}60%{transform:scale(.98)}}
.fish{animation:swim 5s linear infinite}
.fish2{animation:swim 7s linear infinite reverse}
@keyframes swim{from{transform:translateX(-80px)}to{transform:translateX(320px)}}
.twinkle{animation:twinkle 1.2s ease-in-out infinite}
.twinkle:nth-child(2n){animation-delay:.6s}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.2}}
.rainbow{animation:slide 2s linear infinite}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-80px)}}
.steam circle{animation:steam 1.6s ease-out infinite}
.steam circle:nth-child(2){animation-delay:.5s}.steam circle:nth-child(3){animation-delay:1s}
@keyframes steam{0%{transform:translateY(0);opacity:.85}100%{transform:translateY(-90px);opacity:0}}
.sinkwater,.tubwater{animation:pour .25s linear infinite}
@keyframes pour{0%,100%{opacity:1}50%{opacity:.7}}
.swirl{animation:spin .6s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.jack{animation:jack .5s ease-out;transform-box:fill-box;transform-origin:50% 100%}
@keyframes jack{0%{transform:scaleY(.1)}60%{transform:scaleY(1.2)}100%{transform:scaleY(1)}}

#dark{position:absolute;left:0;top:0;width:1600px;height:790px;pointer-events:none;z-index:20000;transition:background .6s}
#fx{position:absolute;left:0;top:0;width:1600px;height:790px;pointer-events:none;z-index:25000}
.particle{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;animation:rise 1.1s ease-out forwards}
@keyframes rise{0%{transform:translateY(0) scale(.4);opacity:0}20%{opacity:1;transform:translateY(-20px) scale(1)}100%{transform:translateY(-130px) scale(.9);opacity:0}}
.bubble{position:absolute;transform:translate(-50%,-100%);background:#FFF;border-radius:28px;padding:10px 22px;font-size:34px;font-weight:700;box-shadow:0 5px 0 rgba(46,42,79,.15);white-space:nowrap;animation:popin .3s ease-out}
.bubble:after{content:"";position:absolute;left:50%;bottom:-14px;margin-left:-12px;border:12px solid transparent;border-top-color:#FFF;border-bottom:0}

#bar{position:absolute;left:0;top:790px;width:1600px;height:110px;background:#2E2A4F;z-index:40000;display:flex;align-items:center;justify-content:center;gap:10px}
.rb{width:238px;height:88px;border-radius:26px;border:0;background:#4A4573;color:#FFF;font:inherit;font-size:21px;font-weight:600;display:flex;align-items:center;gap:8px;padding:0 12px;box-sizing:border-box;cursor:pointer;transition:transform .15s,background .15s}
.rb svg{flex:none;width:50px;height:50px}
.rb.on{background:#FFC93C;color:#2E2A4F}
.dragging .rb:not(.on){background:#6E66B3;transform:scale(1.06)}
.rb.target{background:#3BA55C!important;color:#FFF;transform:scale(1.12)!important}
.tb{position:absolute;top:18px;width:72px;height:72px;border-radius:50%;border:0;background:rgba(255,255,255,.85);z-index:40000;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 0 rgba(46,42,79,.15)}
#bHome{right:22px}#bSound{right:108px}
#start{position:absolute;inset:0;z-index:50000;background:linear-gradient(#9FD4FF,#DDEBFF 60%,#FFF8EC);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#start h1{margin:0;font-size:96px;font-weight:700;color:#2E2A4F;letter-spacing:1px}
#start p{margin:0;font-size:30px;color:#5A5478;font-weight:500}
#play{margin-top:16px;width:190px;height:190px;border-radius:50%;border:0;background:#3BA55C;box-shadow:0 10px 0 #2A7D44;cursor:pointer;display:flex;align-items:center;justify-content:center;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
#crew{display:flex;align-items:flex-end;gap:0}
#reset{position:absolute;right:30px;bottom:24px;border:0;background:rgba(255,255,255,.7);border-radius:20px;padding:12px 22px;font:inherit;font-size:22px;color:#5A5478;cursor:pointer}
</style>
</head>

</div>

 o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+d);

}
function headY(o){var el=nodes[o.id];return el?parseFloat(el.style.top)+40:o.y-200;}
var GIFT={kid:{teddy:'Mein Teddy!',ball:'Fang den Ball!',car:'Brumm brumm!',balloon:'Ein Ballon!',wand:'Blubb blubb!',duck:'Quak quak!',block:'Wir bauen einen Turm!',bone:'Der ist für Bello!',top:'Dreh dich!'},dog:{bone:'Wuff! Mein Knochen!',ball:'Wuff wuff!',teddy:'Wuff?'}};
function give(who,toy){
 var t=TYPE[who.id],r=ROOM[S.room];
 if(who.pose==='sleep'){SFX.snore();say(who,'Zzz …');}
 else if(t==='kid'){SFX.giggle();say(who,GIFT.kid[toy.kind]||'Danke!');anim(who,'jump');if(toy.kind==='wand'){SFX.bubble();fx(who.x,headY(who),'bubble',8);}else fx(who.x,headY(who),'heart',3);}
 else if(t==='dog'){SFX.bark();say(who,GIFT.dog[toy.kind]||'Wuff!');anim(who,'wiggle');fx(who.x,headY(who),'heart',toy.kind==='bone'?6:2);}
 else{SFX.hop();say(who,'Mümmel?');anim(who,'jump');}
 if(toy.kind==='balloon'){nodes[toy.id].classList.add('float');save();return;}
 toy.on=null;toy.x=Math.max(90,Math.min(1510,who.x+(who.x<1350?110:-110)));toy.y=Math.max(r.floor[0],Math.min(r.floor[1],who.y));
 nodes[toy.id].innerHTML=entHTML(toy);moveTo(toy,'fall');save();
}
function water(can){
 var st=S.rs.garten,bed=S.room==='garten'&&can.x>930&&can.x<1320&&can.y>460&&can.y<705;
 anim(can,'wiggle');fx(can.x+34,headY(can)-10,'drop',6,'fallp');SFX.water(1.2);
 if(bed){if(st.flowers<3){st.flowers++;setTimeout(function(){renderRoomState();SFX.magic();fx(1120,500,'heart',st.flowers===3?6:3);},700);}else setTimeout(function(){fx(1120,500,'star',3);},700);save();}
}
function slideDown(e,sp){
 setTimeout(function(){
  var el=nodes[e.id];if(!el||e.spot!==sp.id||(drag&&drag.e===e))return;
  e.spot=null;renderRoomState();SFX.slide();el.classList.add('slide');e.x=sp.slide[0];e.y=sp.slide[1];place(e,el,e.pose);
  setTimeout(function(){
   if(nodes[e.id]!==el||(drag&&drag.e===e))return;
   el.classList.remove('slide');var t=typeOf(e);e.pose=t==='bunny'?'sit':'stand';el.innerHTML=entHTML(e,e.pose);place(e,el,e.pose);
   if(t==='kid'){SFX.giggle();say(e,'Juhu!');}else if(t==='dog'){SFX.bark();say(e,'Wuff!');}else SFX.hop();
   anim(e,'jump');fx(e.x,e.y-150,'star',3);save();
  },1050);
 },650);
}
function drive(e){
 var el=nodes[e.id],d=e.dir||1,nx=Math.max(100,Math.min(1500,e.x+d*340));
 if(Math.abs(nx-e.x)<20){d=-d;e.dir=d;el.innerHTML=entHTML(e);nx=Math.max(100,Math.min(1500,e.x+d*340));}
 SFX.vroom();el.classList.add('drive');e.x=nx;place(e,el);
 setTimeout(function(){el.classList.remove('drive');if(e.x>=1500||e.x<=100){e.dir=-(e.dir||1);el.innerHTML=entHTML(e);}save();},950);
}
function popBalloon(e){
 var el=nodes[e.id];SFX.balloon();fx(e.x,headY(e)-10,'star',6);el.style.visibility='hidden';
 setTimeout(function(){e.c=((e.c||0)+1)%6;if(nodes[e.id]!==el)return;el.innerHTML=entHTML(e);el.style.visibility='';anim(e,'pop');SFX.pop();save();},1800);
}
function fetchBone(bone){
 var d=entById('bello'),del=nodes.bello;
 if(!d||!del||d.room!==S.room||d.pose==='sleep'||(drag&&drag.e===d)){anim(bone,'wiggle');SFX.squeak();if(d&&d.pose==='sleep'&&d.room===S.room)say(d,'Zzz …');return;}
 var r=ROOM[S.room];d.spot=null;d.pose='stand';del.innerHTML=entHTML(d,'stand');renderRoomState();
 d.x=Math.max(90,Math.min(1510,bone.x+(bone.x>220?-110:110)));d.y=Math.max(r.floor[0],Math.min(r.floor[1],bone.y));
 moveTo(d,'slide',1000);SFX.bark();
 setTimeout(function(){anim(d,'wiggle');SFX.bark();say(d,'Wuff! Knochen!');fx(d.x,headY(d),'heart',5);save();},1000);
}
function drop(e,p){
 var t=typeOf(e),r=ROOM[S.room],el=nodes[e.id];
 var b=btnAt(p);
 if(b&&b.id!==S.room){
  e.room=b.id;e.spot=null;e.on=null;e.float=false;e.x=450+Math.random()*700;e.y=720+Math.random()*50;
  if(e.kind==='balloon')e.y=520+Math.random()*80;
  if(t!=='item')e.pose=t==='bunny'?'sit':'stand';
  SFX.whoosh();b.btn.classList.add('target');setTimeout(function(){b.btn.classList.remove('target');},350);
  renderRoomState();renderEnts();save();return;
 }
 if(t==='item'){
  var who=creatureAt(p,e);
  if(FOODS.indexOf(e.kind)>=0&&who){eat(who,e);return;}
  if(e.kind==='can')water(e);
  if(e.kind==='block'&&stackOn(e))return;
  if(e.kind==='duck'&&S.room==='bad'&&e.x>840&&e.x<1360&&e.y>440&&e.y<720&&S.rs.bad.tubFull){
   e.float=true;e.x=Math.max(880,Math.min(1320,e.x));e.y=598;SFX.quack();renderEnts();save();return;
  }
  if(who&&e.kind!=='can'){give(who,e);return;}
 } else {
  var best=null,bd=1e9;
  r.spots.forEach(function(sp){if(sp.acc.indexOf(t)<0||!free(sp.id,S.room,e))return;var dx=Math.abs(sp.x-e.x),dy=Math.abs(sp.y-e.y);if(dx<150&&dy<160&&dx+dy<bd){bd=dx+dy;best=sp;}});
  if(best){
   e.spot=best.id;e.x=best.x;e.y=best.y;e.pose=best.pose;
   el.innerHTML=entHTML(e,e.pose);renderRoomState();place(e,el,e.pose);
   SFX.pop();fx(e.x,e.y-120,best.pose==='sleep'?'note':'star',3);
   if(best.pose==='bath')SFX.bubble();
   if(best.pose==='sleep'&&t==='kid')setTimeout(function(){say(e,'Gute Nacht!');},250);
   if(best.anim==='swing'&&t==='kid')setTimeout(function(){say(e,'Höher!');},300);
   if(best.anim==='rock'&&t==='kid')setTimeout(function(){say(e,'Hü hott!');},300);
   if(best.slide)slideDown(e,best);
   save();return;
  }
  e.pose=t==='bunny'?'sit':'stand';
 }
 var ny;
 if(e.kind==='balloon'){ny=Math.max(110,Math.min(780,e.y));el.classList.add('float');}
 else ny=Math.max(r.floor[0],Math.min(r.floor[1],e.y));
 e.x=Math.max(90,Math.min(1510,e.x));
 el.innerHTML=entHTML(e,e.pose);
 if(ny!==e.y){el.classList.add('fall');e.y=ny;setTimeout(function(){el.classList.remove('fall');},320);}
 place(e,el,e.pose);
 SFX.drop();save();
}
function eat(who,food){
 S.ents=S.ents.filter(function(o){return o!==food;});
 var el=nodes[food.id];if(el)el.remove();delete nodes[food.id];
 SFX.chomp();setTimeout(SFX.yum,450);
 var t=TYPE[who.id];
 var txt=t==='kid'?['Mmmh!','Lecker!','Danke!'][Math.floor(Math.random()*3)]:t==='dog'?'Wuff! Lecker!':(food.kind==='carrot'?'Möhre! Juhu!':'Mümmel!');
 say(who,txt);anim(who,'jump');fx(who.x,(parseFloat(nodes[who.id].style.top)||who.y-200)+40,'heart',food.kind==='carrot'&&t==='bunny'?6:3);
 save();
}
var PHRASES={ben:['Hallo!','Juhu!','Auf geht’s!','Hihi!','Super!','Komm, Bello!'],mia:['Hallo!','Hihi!','Juhu!','Toll!','Zusammen schaffen wir das!','Wo ist Flocke?']};
function tap(e){
 var t=typeOf(e);
 if(t==='kid'){
  if(e.pose==='sleep'){SFX.snore();say(e,'Zzz …');return;}
  if(e.pose==='bath'){SFX.bubble();say(e,'Blubb blubb!');fx(e.x,e.y-150,'star',2);return;}
  anim(e,'jump');SFX.giggle();var ph=PHRASES[e.id];say(e,ph[Math.floor(Math.random()*ph.length)]);return;
 }
 if(t==='dog'){
  if(e.pose==='sleep'){SFX.snore();say(e,'Zzz …');return;}
  if(!e.spot){e.pose=e.pose==='sit'?'stand':'sit';nodes[e.id].innerHTML=entHTML(e,e.pose);place(e,nodes[e.id],e.pose);}
  anim(e,'wiggle');SFX.bark();say(e,'Wuff!');save();return;
 }
 if(t==='bunny'){
  if(e.pose==='sleep'){SFX.snore();say(e,'Zzz …');return;}
  var el=nodes[e.id];if(e.spot){anim(e,'jump');SFX.hop();return;}
  e.pose='hop';el.innerHTML=entHTML(e,'hop');place(e,el,'hop');anim(e,'jump');SFX.hop();
  setTimeout(function(){if(nodes[e.id]===el&&e.pose==='hop'){e.pose='sit';el.innerHTML=entHTML(e,'sit');place(e,el,'sit');}},520);return;
 }
 if(e.kind==='ball'){anim(e,'bounce');SFX.boing();return;}
 if(e.kind==='car'){drive(e);return;}
 if(e.kind==='balloon'){popBalloon(e);return;}
 if(e.kind==='bone'){fetchBone(e);return;}
 if(e.kind==='can'){water(e);return;}
 if(e.kind==='wand'){anim(e,'wiggle');fx(e.x-20,headY(e)-20,'bubble',8);SFX.bubble();return;}
 if(e.kind==='top'){anim(e,'spin');SFX.whirr();return;}
 if(e.kind==='block'){anim(e,'wiggle');SFX.block();return;}
 if(e.kind==='duck'){anim(e,'wiggle');SFX.quack();say(e,'Quak!');return;}
 if(e.kind==='teddy'){anim(e,'wiggle');SFX.squeak();fx(e.x,e.y-90,'heart',2);return;}
 anim(e,'wiggle');SFX.pop();
}

/* ================= Gegenstände im Zimmer ================= */
roomsEl.addEventListener('click',function(ev){
 var g=ev.target.closest&&ev.target.closest('[data-act]');if(!g)return;audio();
 var act=g.getAttribute('data-act'),st=S.rs[S.room],r=ROOM[S.room];
 var p=toStage(ev);
 if(act==='lamp'){st.lamp=!st.lamp;SFX.click();if(st.lamp)fx(r.lamp[0],r.lamp[1],'star',2);}
 else if(act==='window'){S.night=!S.night;SFX.magic();fx(p[0],p[1],'star',4);}
 else if(act==='tv'){st.tv=(st.tv+1)%4;SFX.tv();if(st.tv)fx(1305,280,'note',2);}
 else if(act==='plant'){st.plant=(st.plant+1)%4;SFX.pop();fx(118,470,st.plant?'heart':'star',3);}
 else if(act==='fridge'){st.fridge=!st.fridge;SFX.whoosh();}
 else if(act.indexOf('food:')===0){ev.stopPropagation();spawnFood(act.slice(5));return;}
 else if(act==='pot'){st.pot=!st.pot;st.pot?SFX.bubble():SFX.click();}
 else if(act==='box'){st.box=!st.box;if(st.box){SFX.boing();fx(1175,520,'star',4);}else SFX.drop();}
 else if(act==='sink'){tmpClass('bad','sink-on',2000);SFX.water(2);}
 else if(act==='tub'){st.tubFull=!st.tubFull;if(st.tubFull){tmpClass('bad','tub-pour',1500);SFX.water(1.5);setTimeout(SFX.bubble,1200);}else{noise(0.8,'lowpass',800,200,0.2);S.ents.forEach(function(o){if(o.kind==='duck'&&o.float){o.float=false;o.y=765;o.x=760;}});}renderRoomState();setTimeout(renderEnts,st.tubFull?900:0);save();return;}
 else if(act==='toilet'){tmpClass('bad','flush',1400);SFX.flush();return;}
 else if(act==='cuckoo'){tmpClass('wohn','cuckoo',1500);SFX.cuckoo();fx(505,170,'note',2);return;}
 else if(act==='toaster'){tmpClass('kueche','toast-up',900);SFX.ding();var tx=[950,1040][Math.floor(Math.random()*2)];setTimeout(function(){spawnFood('toast',tx,536);},300);return;}
 else if(act==='mobile'){st.mobile=!st.mobile;if(st.mobile){SFX.lullaby();fx(1250,150,'note',3);}else SFX.click();}
 else if(act.indexOf('xylo:')===0){SFX.xylo(+act.slice(5));bonk(g);fx(p[0],p[1]-40,'note',1);return;}
 else if(act==='drum'){SFX.drum();bonk(g.querySelector('.drumbody'));fx(580,560,'star',2);return;}
 else if(act==='radio'){st.music=!st.music;SFX.click();if(st.music)fx(1350,320,'note',4);renderRoomState();refreshPlaces();if(st.music)startMusic();save();return;}
 else if(act==='easel'){st.paint=(st.paint+1)%4;SFX.magic();fx(1090,360,'star',4);}
 else if(act==='sand'){st.sand=(st.sand+1)%4;noise(0.25,'bandpass',600,300,0.25);fx(1130,680,'star',st.sand===3?5:2);}
 else if(act==='bed'){bonk(g);SFX.pop();var cn=entById('can');if(!st.flowers&&cn&&nodes.can)anim(cn,'wiggle');return;}
 renderRoomState();save();
});
function spawnFood(kind,x,y){
 var foods=S.ents.filter(function(o){return FOODS.indexOf(o.kind)>=0;});
 if(foods.length>=8){var old=foods[0];S.ents=S.ents.filter(function(o){return o!==old;});}
 var e={id:'f'+(S.seq++),kind:kind,room:S.room,x:x||360+Math.random()*90,y:y||740+Math.random()*30};
 S.ents.push(e);SFX.pop();renderEnts();anim(e,'pop');save();
}
function bonk(g){if(!g)return;g.classList.remove('bonk');try{g.getBBox();}catch(_){}g.classList.add('bonk');setTimeout(function(){g.classList.remove('bonk');},320);}
var MELODY=[[523,1],[587,1],[659,1],[698,1],[784,2],[784,2],[880,1],[880,1],[880,1],[880,1],[784,4],[880,1],[880,1],[880,1],[880,1],[784,4],[698,1],[698,1],[698,1],[698,1],[659,2],[659,2],[587,1],[587,1],[587,1],[587,1],[523,4]];
var musicOn=false,mIdx=0;
function startMusic(){if(musicOn)return;musicOn=true;mIdx=0;musicStep();}
function musicStep(){
 var se=document.getElementById('start');
 if(!S.rs.spiel.music||S.room!=='spiel'||se.style.display!=='none'){musicOn=false;return;}
 var n=MELODY[mIdx%MELODY.length];tone(n[0],0.2*n[1]+0.1,'triangle',0.12);if(n[1]>=2)tone(n[0]/2,0.3,'sine',0.08);
 if(mIdx%6===0)fx(1350,320,'note',1);
 mIdx++;setTimeout(musicStep,n[1]*230);
}

/* ================= Tipps: Gegenstände leuchten kurz auf ================= */
setInterval(function(){
 if(drag||document.getElementById('start').style.display!=='none')return;
 var list=ROOM[S.room].el.querySelectorAll('.back > [data-act]');if(!list.length)return;
 var g=list[Math.floor(Math.random()*list.length)];g.classList.remove('hint');void g.getBBox();g.classList.add('hint');setTimeout(function(){g.classList.remove('hint');},1200);
},5000);

/* ================= Bildschirm & Start ================= */
function fit(){
 var w=window.innerWidth,h=window.innerHeight;scale=Math.min(w/W,h/H);offX=(w-W*scale)/2;offY=(h-H*scale)/2;
 stage.style.transform='translate('+offX+'px,'+offY+'px) scale('+scale+')';
}
window.addEventListener('resize',fit);fit();
var startEl=document.getElementById('start');
document.getElementById('play').addEventListener('click',function(){audio();SFX.magic();startEl.style.display='none';renderAll();});
document.getElementById('bHome').addEventListener('click',function(){audio();SFX.click();startEl.style.display='flex';});
document.getElementById('bSound').addEventListener('click',function(){audio();S.sound=!S.sound;renderRoomState();SFX.click();save();});
var resetArmed=false;
document.getElementById('reset').addEventListener('click',function(ev){
 var b=ev.currentTarget;audio();
 if(!resetArmed){resetArmed=true;b.textContent='Wirklich? Nochmal tippen';setTimeout(function(){resetArmed=false;b.textContent='Neu anfangen';},3000);return;}
 S=defaultState();save();resetArmed=false;b.textContent='Neu anfangen';SFX.magic();renderAll();
});
document.addEventListener('contextmenu',function(e){e.preventDefault();});
window.PUPPENHAUS={state:function(){return S;}};
renderAll();
})();
</script>
</body>
